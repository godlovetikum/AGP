name: Generate Gradle wrapper JAR

on:
  workflow_dispatch:

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install JavaScript dependencies when necessary
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d node_modules ] || [ ! -f node_modules/@react-native/gradle-plugin/settings.gradle.kts ]; then
            npm ci
          fi
          test -f node_modules/@react-native/gradle-plugin/settings.gradle.kts

      - name: Generate Gradle wrapper JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          test -f settings.gradle
          test -f build.gradle
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -x gradlew

      - name: Upload Gradle wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: agp-gradle-wrapper
          path: |
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradlew
            android/gradlew.bat
          if-no-files-found: error
