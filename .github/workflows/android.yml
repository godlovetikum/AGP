name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show checked-out project layout
        run: |
          pwd
          printf '%s\n' '--- repository root ---'
          find . -maxdepth 2 -type f | sort | sed -n '1,100p'
          printf '%s\n' '--- Android Gradle files ---'
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          ls -la android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify React Native Gradle plugin
        run: test -f node_modules/@react-native/gradle-plugin/settings.gradle.kts

      - name: Verify committed Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -x android/gradlew

      - name: Generate debug signing keystore when absent
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f android/app/debug.keystore

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Build release APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/android"
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: agp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload generated Android tooling
        uses: actions/upload-artifact@v4
        with:
          name: agp-generated-android-tooling
          path: android/app/debug.keystore
          if-no-files-found: error
